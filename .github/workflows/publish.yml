name: Publish Container

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.deleted == false
    runs-on: ubuntu-latest

    steps:
      - name: Validate version and determine image
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable version tag such as v1.0.1" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test hand entry and scoring
        run: node --test t/*.test.js

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The Dockerfile runs the Perl tests during each architecture's build.
      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: riichi-atelier:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=riichi-atelier
          cache-to: type=gha,mode=max,scope=riichi-atelier

      - name: Smoke-test the production server
        shell: bash
        run: |
          cleanup() {
            docker inspect --format '{{json .State}}' riichi-atelier-ci || true
            docker logs riichi-atelier-ci || true
            docker rm -f riichi-atelier-ci || true
          }
          trap cleanup EXIT

          docker run -d --name riichi-atelier-ci \
            -p 127.0.0.1:18080:8080 riichi-atelier:smoke

          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 1 \
            --connect-timeout 2 --max-time 5 --retry-max-time 60 \
            http://127.0.0.1:18080/health

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=riichi-atelier
          cache-to: type=gha,mode=max,scope=riichi-atelier
